syntax = "proto3";

package proto.inventory;

import "google/protobuf/empty.proto";

option java_package = "com.teamsolution.proto.grpc.inventory";
option java_multiple_files = true;

service InventoryService {
  rpc GetVariantsByIds(GetVariantsByIdsRequest) returns (GetVariantsByIdsResponse);
}

message GetVariantsByIdsRequest {
  repeated string variant_ids = 1;
}

message GetVariantsByIdsResponse {
  repeated Variant variants = 1;
}

message Variant {
  string id = 1;
  int64 price = 2;
  string image = 3;
  int64 stock = 4;

  string product_id = 5;
  string product_name = 6;
  string product_slug = 7;

  repeated AttributeValue attributes = 8;
}

message AttributeValue {
  string id = 1;
  string value = 2;
}