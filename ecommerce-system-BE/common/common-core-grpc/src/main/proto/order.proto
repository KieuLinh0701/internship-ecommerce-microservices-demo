syntax = "proto3";

package proto.order;

import "google/protobuf/empty.proto";

option java_package = "com.teamsolution.proto.grpc.order";
option java_multiple_files = true;

service OrderService {
  rpc GetOrderForPayment (GetOrderForPaymentRequest) returns (GetOrderForPaymentResponse);
}

message GetOrderForPaymentRequest {
  string order_id = 1;
  string customer_id = 2;
}

message GetOrderForPaymentResponse {
  int64 total = 3;
  string payment_status = 4;
}