server:
  port: 9007

grpc:
  server:
    port: 9097
    security:
      enabled: false
  client:
    customer-service:
      address: discovery:///CUSTOMER-SERVICE
      negotiation-type: plaintext
    inventory-service:
      address: discovery:///INVENTORY-SERVICE
      negotiation-type: plaintext
    payment-service:
      address: discovery:///PAYMENT-SERVICE
      negotiation-type: plaintext
    cart-service:
      address: discovery:///CART-SERVICE
      negotiation-type: plaintext
  retry:
    max-attempts: 3
    base-delay-ms: 100
  timeout: 5s

spring:
  application:
    name: order-service
  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://localhost:5432/order_service_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: inventory-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: true
    listener:
      ack-mode: RECORD

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    metadata-map:
      grpcPort: 9096
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

logging:
  file:
    name: logs/order-service.log
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.data.elasticsearch: DEBUG
    co.elastic.clients: DEBUG
    io.opentelemetry.exporter: OFF

openapi:
  title: Order Service API
  description: Order Service API Documentation
  server-url: http://localhost:9000/api/orders
  server-description: Gateway - Local

kafka:
  consumer:
    dlt:
      suffix: ".DLT"
    retry:
      initial-interval-ms: 2000
      multiplier: 2.0
      max-kafka-retry: 3
      max-manual-retry: 3

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      enabled: true
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

order:
  payment-timeout-hours: 24

outbox:
  scheduler:
    fixed-delay-ms: 5000
    retry-delay-seconds: 5

temp-image-cleanup:
  fixed-rate-ms: 3600000
  ttl-minutes: 60

feedback-image:
  max-files: 5

internal:
  secret: 32f9e68f9ac7ebc99d8d712ad162d78f5b7053665e143ba92a747af340b38613