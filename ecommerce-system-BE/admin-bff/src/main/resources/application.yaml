server:
  port: 9009

spring:
  application:
    name: admin-bff
  profiles:
    active: local

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

consumer:
  failed-event-services:
    - notification-service
    - inventory-service
    - search-service
    - cart-service

  services:
    notification: notification-service
    auth: auth-service
    inventory: inventory-service
  timeout: 3

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      enabled: true
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  observations:
    key-values:
      application: ${spring.application.name}
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

openapi:
  title: Admin Bff API
  description: Admin Backend For Frontend API documentation
  server-url: http://localhost:9000/api/admin
  server-description: Gateway - Local

